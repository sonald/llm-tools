[project]
name = "llm-tools"
version = "0.1.0"
description = "A flexible tool for analyzing LLMs/VLMs with layer-wise logits extraction, attention visualization, and confidence calculation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pillow>=9.5.0",
    "scipy>=1.10.0"
]
